name: Yarn foundation and officer authentication
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_for_tests
          POSTGRES_DB: aeter_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aeter_ci"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      # One-time bootstrap only; commit updated yarn.lock, then restore immutable mode.
      - name: Bootstrap new upload dependencies
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          YARN_ENABLE_HARDENED_MODE: '0'
      - name: Export generated Yarn lock
        run: |
          echo 'BEGIN_AETER_P3_YARN_LOCK'
          base64 -w0 yarn.lock
          echo
          echo 'END_AETER_P3_YARN_LOCK'
      # Temporary migration bootstrap in isolated CI only; remove once the SQL is tracked.
      - name: Generate Phase 3 migration
        run: yarn workspace @aeter/api db:generate
        env:
          DATABASE_URL: postgresql://ci:ci_only_for_tests@127.0.0.1:55432/aeter_ci
      - name: Export generated Phase 3 migration
        shell: bash
        run: |
          find apps/api/drizzle -type f -print0 | sort -z | while IFS= read -r -d '' path; do
            echo "BEGIN_AETER_P3_FILE=$path"
            base64 -w0 "$path"
            echo
            echo "END_AETER_P3_FILE=$path"
          done
      - run: yarn typecheck
      - run: yarn build
      - name: Apply tracked Drizzle migrations to isolated PostgreSQL
        run: yarn workspace @aeter/api db:migrate
        env:
          DATABASE_URL: postgresql://ci:ci_only_for_tests@127.0.0.1:55432/aeter_ci
      - name: Run unit, authentication, attendance, private-case and screenshot-retention integration tests
        run: yarn test
        env:
          AUTH_TEST_DATABASE_URL: postgresql://ci:ci_only_for_tests@127.0.0.1:55432/aeter_ci
      - name: Verify API health and database readiness
        shell: bash
        env:
          DATABASE_URL: postgresql://ci:ci_only_for_tests@127.0.0.1:55432/aeter_ci
        run: |
          yarn workspace @aeter/api start > /tmp/aeter-api.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:3001/api/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:3001/api/ready | grep -q '"status":"ready"'
