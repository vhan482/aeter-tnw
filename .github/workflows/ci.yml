name: Yarn foundation checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install locked dependencies
        run: yarn install --immutable
      # Temporary generation step: initial migrations are reviewed/committed,
      # then this is removed and CI checks the tracked migration set.
      - name: Generate initial schema migration
        run: yarn workspace @aeter/api db:generate
        env:
          DATABASE_URL: postgresql://bootstrap:bootstrap@127.0.0.1:55432/bootstrap
      - name: Export generated migrations for repository commit
        shell: bash
        run: |
          find apps/api/drizzle -type f -print0 | sort -z | while IFS= read -r -d '' path; do
            echo "BEGIN_AETER_MIGRATION_FILE=$path"
            base64 -w0 "$path"
            echo
            echo "END_AETER_MIGRATION_FILE=$path"
          done
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
