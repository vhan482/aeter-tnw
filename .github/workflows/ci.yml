name: Yarn foundation checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      # Temporary bootstrap: GitHub PR environments default to immutable installs.
      # Generate the initial lock once, commit it, then restore immutable mode.
      - name: Bootstrap dependency lock
        run: yarn install
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 'false'
          YARN_ENABLE_HARDENED_MODE: '0'
      - name: Export generated lock for repository commit
        run: |
          echo 'BEGIN_AETER_YARN_LOCK'
          base64 -w0 yarn.lock
          echo
          echo 'END_AETER_YARN_LOCK'
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
