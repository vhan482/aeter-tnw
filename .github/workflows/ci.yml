name: Yarn foundation checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_only_for_tests
          POSTGRES_DB: aeter_ci
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d aeter_ci"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - name: Verify tracked Drizzle migrations against PostgreSQL 17
        run: yarn workspace @aeter/api db:migrate
        env:
          DATABASE_URL: postgresql://ci:ci_only_for_tests@127.0.0.1:55432/aeter_ci
      - name: API health and database readiness smoke test
        shell: bash
        env:
          DATABASE_URL: postgresql://ci:ci_only_for_tests@127.0.0.1:55432/aeter_ci
          HOST: 127.0.0.1
          PORT: '3001'
        run: |
          yarn workspace @aeter/api start > /tmp/aeter-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused --fail --silent http://127.0.0.1:3001/api/health | grep -q '"status":"ok"'
          curl --fail --silent http://127.0.0.1:3001/api/ready | grep -q '"status":"ready"'
